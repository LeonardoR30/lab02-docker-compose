services:
  api1:
    build: ./api
    container_name: api1
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - API_NAME=api1
    env_file:
      - .env
    depends_on:
      - db
  api2:
    build: ./api
    container_name: api2
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - API_NAME=api2
    env_file:
      - .env
    depends_on:
      - db
  api3:
    build: ./api
    container_name: api3
    ports:
      - "3003:3000"
    environment:
      - PORT=3000
      - API_NAME=api3
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: postgres
    container_name: db
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: